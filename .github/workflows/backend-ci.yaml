name: Backend Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - starter/backend/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    env:
      PIPENV_VENV_IN_PROJECT: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore pip and virtualenv cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            starter/backend/.venv
          key: ${{ runner.os }}-python-3.10-${{ hashFiles('starter/backend/Pipfile') }}
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev
      - name: Run linter
        run: pipenv run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    env:
      PIPENV_VENV_IN_PROJECT: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore pip and virtualenv cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            starter/backend/.venv
          key: ${{ runner.os }}-python-3.10-${{ hashFiles('starter/backend/Pipfile') }}
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev
      - name: Run tests
        run: pipenv run test

  build:
    name: Build Docker image
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    env:
      PIPENV_VENV_IN_PROJECT: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore pip and virtualenv cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            starter/backend/.venv
          key: ${{ runner.os }}-python-3.10-${{ hashFiles('starter/backend/Pipfile') }}
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev
      - name: Run tests
        run: pipenv run test
      - name: Build Docker image
        run: docker build --tag mp-backend:ci .